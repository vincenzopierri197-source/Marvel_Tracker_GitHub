<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e62429">
<meta name="description" content="Marvel Tracker: segui i film e le serie Marvel e salva i tuoi progressi.">
<title>Marvel Tracker</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#151519; --panel2:#1d1d22; --text:#f5f5f7;
  --muted:#9b9ba3; --red:#e62429; --border:#2b2b31; --green:#48d597;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at top,#1b0b0d 0,#0b0b0d 38%,#080809 100%);
  color:var(--text); min-height:100vh;
}
button,input{font:inherit}
.container{width:min(980px,100%);margin:auto;padding:18px 16px 40px}
.hero{text-align:center;padding:22px 0 14px}
.hero h1{margin:0;color:var(--red);font-size:clamp(28px,6vw,46px);letter-spacing:1px;text-transform:uppercase}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.progress{
  position:sticky;top:0;z-index:50;background:rgba(11,11,13,.94);
  backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;
  padding:14px;margin:10px 0 18px;box-shadow:0 10px 30px rgba(0,0,0,.22)
}
.progress-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}
.bar{height:8px;background:#29292e;border-radius:99px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:var(--red);transition:width .25s}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}
.search,.filter-btn,.reset-btn{
  border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:13px;
  padding:12px 14px;outline:none
}
.search:focus{border-color:var(--red)}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter-btn{cursor:pointer;padding:9px 12px;color:var(--muted)}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.source-note{
  color:var(--muted);font-size:12px;margin:0 0 14px;line-height:1.5
}
.source-note a{color:#ddd}
.phase{
  border:1px solid var(--border);background:rgba(21,21,25,.9);border-radius:17px;
  margin:12px 0;overflow:hidden
}
.phase-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px;background:none;border:0;color:var(--text);text-align:left;cursor:pointer
}
.phase-title{font-weight:800;font-size:16px}
.phase-meta{color:var(--muted);font-size:12px;margin-top:3px}
.chevron{font-size:20px;transition:transform .2s}
.phase.open .chevron{transform:rotate(180deg)}
.phase-body{display:none;padding:0 10px 10px}
.phase.open .phase-body{display:block}
.card{
  display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid #28282e;
  border-radius:13px;padding:13px;margin:8px 0;transition:.2s
}
.card:hover{border-color:#44444c}
.card.hidden{display:none}
.check{
  appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:0 0 24px;
  border:2px solid #777;border-radius:7px;position:relative;cursor:pointer
}
.check:checked{background:var(--red);border-color:var(--red)}
.check:checked:after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg)}
.title{flex:1;font-size:15px;line-height:1.35}
.card.done .title{color:var(--muted);text-decoration:line-through}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:4px 7px;border-radius:99px;background:#303037;color:#bbb}
.badge.film{color:#f4c1c3}.badge.serie{color:#b9e9d5}
.empty{padding:22px;text-align:center;color:var(--muted);display:none}
.actions{display:flex;gap:8px;margin-top:14px}
.reset-btn{width:100%;cursor:pointer;color:#bbb}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;min-height:18px}
@media(max-width:680px){
  .controls{grid-template-columns:1fr}
  .filters{display:grid;grid-template-columns:repeat(3,1fr)}
  .filter-btn{padding:10px 6px}
  .card{padding:12px}
  .title{font-size:14px}
}
</style>
</head>
<body>
<main class="container">
  <header class="hero">
    <h1>Marvel Tracker</h1>
    <p>Film e serie · progresso salvato sul dispositivo</p>
  </header>

  <section class="progress" aria-label="Progresso">
    <div class="progress-top">
      <span>Completamento</span>
      <span id="progressText">0% · 0/0</span>
    </div>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
  </section>

  <div class="controls">
    <input id="search" class="search" type="search" placeholder="Cerca un film o una serie…">
    <div class="filters" role="group" aria-label="Filtra">
      <button class="filter-btn active" data-filter="all">Tutti</button>
      <button class="filter-btn" data-filter="film">Film</button>
      <button class="filter-btn" data-filter="serie">Serie</button>
    </div>
  </div>

  <p class="source-note">
    Fonte di riferimento per gli aggiornamenti:
    <a id="sourceLink" target="_blank" rel="noopener">TV Sorrisi e Canzoni</a>.
    Gli aggiornamenti automatici vengono eseguiti da GitHub Actions.
  </p>

  <section id="content"></section>
  <div id="empty" class="empty">Nessun titolo trovato.</div>

  <div class="actions">
    <button class="reset-btn" id="resetBtn">Azzera tutti i progressi</button>
  </div>
  <div id="status" class="status"></div>
</main>

<script>
const STORAGE_PREFIX = "marvel_tracker_v2_";
let data = {sections:[], source:""};
let filter = "all";
let query = "";

function slug(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function key(title){ return STORAGE_PREFIX + slug(title); }

function allItems(){
  return data.sections.flatMap(s => s.items);
}
function visible(item){
  const q = query.trim().toLowerCase();
  const matchQ = !q || item.title.toLowerCase().includes(q);
  const matchF = filter === "all" || item.type === filter;
  return matchQ && matchF;
}

function render(){
  const content = document.getElementById("content");
  content.innerHTML = "";
  let visibleCount = 0;

  data.sections.forEach((section, sIndex) => {
    const items = section.items.filter(visible);
    if(!items.length) return;
    visibleCount += items.length;

    const phase = document.createElement("article");
    phase.className = "phase open";

    const header = document.createElement("button");
    header.className = "phase-header";
    header.innerHTML = `
      <span>
        <span class="phase-title">${escapeHtml(section.phase)}</span>
        <span class="phase-meta">${items.length} titoli visualizzati · ${section.items.length} totali</span>
      </span>
      <span class="chevron">⌄</span>`;
    header.onclick = () => phase.classList.toggle("open");

    const body = document.createElement("div");
    body.className = "phase-body";

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      const checked = localStorage.getItem(key(item.title)) === "true";
      if(checked) card.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "check";
      checkbox.checked = checked;
      checkbox.setAttribute("aria-label", "Segna come visto: " + item.title);
      checkbox.onchange = () => {
        localStorage.setItem(key(item.title), checkbox.checked);
        card.classList.toggle("done", checkbox.checked);
        updateProgress();
      };

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = item.title;

      const badge = document.createElement("span");
      badge.className = "badge " + item.type;
      badge.textContent = item.type === "serie" ? "Serie" : "Film";

      card.append(checkbox, title, badge);
      body.appendChild(card);
    });

    phase.append(header, body);
    content.appendChild(phase);
  });

  document.getElementById("empty").style.display = visibleCount ? "none" : "block";
  updateProgress();
}

function updateProgress(){
  const items = allItems();
  const checked = items.filter(item => localStorage.getItem(key(item.title)) === "true").length;
  const pct = items.length ? Math.round(checked/items.length*100) : 0;
  document.getElementById("progressText").textContent = `${pct}% · ${checked}/${items.length}`;
  document.getElementById("progressFill").style.width = pct + "%";
}

function escapeHtml(value){
  return value.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function load(){
  try{
    const res = await fetch("data/marvel.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
    document.getElementById("sourceLink").href = data.source;
    const date = data.updatedAt ? new Date(data.updatedAt).toLocaleString("it-IT") : "prima pubblicazione";
    document.getElementById("status").textContent = "Dati aggiornati: " + date;
    render();
  }catch(err){
    document.getElementById("status").textContent =
      "Impossibile caricare i dati. Apri il sito tramite GitHub Pages o un server locale.";
    console.error(err);
  }
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value; render();
});
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.filter;
    render();
  });
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Sei sicuro di voler azzerare tutti i progressi?")){
    Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX)).forEach(k => localStorage.removeItem(k));
    render();
  }
});

load();
</script>
</body>
</html>
